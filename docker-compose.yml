services:
  # 静态 Web 应用：宿主端口可用 WEB_PORT 覆盖，默认 8080
  web:
    build: .
    image: passbox-trainer:latest
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 一次性验收服务：类型检查 + 单测 + 构建 + 针对 web 容器的端到端测试
  # 用法：docker compose run --rm verify
  verify:
    image: mcr.microsoft.com/playwright:v1.48.2-noble
    working_dir: /app
    depends_on:
      web:
        condition: service_healthy
    environment:
      E2E_BASE_URL: http://web:80
      CI: "true"
    volumes:
      - .:/app
      - verify_node_modules:/app/node_modules
    command:
      - bash
      - -lc
      - "npm ci && npm run typecheck && npm run test:unit && npm run build && npx playwright test"

volumes:
  verify_node_modules:
